apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: solar-system
  name: solar-system
  namespace: solar-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-system
  template:
    metadata:
      labels:
        app: solar-system
    spec:
      serviceAccountName: default
      containers:
      - name: solar-system
        image: chinmayapradhan/orbit-engine:5259052a69545eda02f7aa72933801740901e74d
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http 
          protocol: TCP 
        envFrom:
        - secretRef:
            name: mongo-db-creds

